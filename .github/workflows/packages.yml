name: packages

# Publishes the framework's packages to GitHub Packages on a release tag
# vX.Y.Z or vX.Y.Z-rc.<n> on main, all at the tag's version (docs/packages.md):
# the NuGet packages of src/BuildingBlocks and src/Modules, and every npm
# package in packages/. Publishing the same version twice is skipped, so a
# re-run is safe.
#
# Every release also gets (docs/packages.md, section 6):
#   - a build provenance attestation for each .nupkg and .tgz: which workflow
#     run built it, from which commit. Check one with
#     `gh attestation verify <file> --repo TrislabCompany/tl-framework`;
#   - a CycloneDX SBOM of the NuGet packages and one of each npm package,
#     attached to the GitHub Release, and kept as the run's artifact `sbom`.

on:
  push:
    tags: ['v*']

permissions: {}

env:
  CYCLONEDX_VERSION: 6.3.2

jobs:
  nuget:
    name: nuget
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: tag
        run: |
          if ! [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a release tag vX.Y.Z or vX.Y.Z-rc.<n>"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is on ${GITHUB_SHA::7}, which is not a commit of main. Only a commit of main is released"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: dotnet pack src/App.slnx -c Release -p:Version="$VERSION" -o "$RUNNER_TEMP/nupkg"

      - name: SBOM of the NuGet packages
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          dotnet tool install CycloneDX --version "$CYCLONEDX_VERSION" --tool-path "$RUNNER_TEMP/tools"
          # Every package of the solution except the test projects, at the release's version.
          "$RUNNER_TEMP/tools/dotnet-CycloneDX" src/App.slnx --exclude-test-projects --output-format Json \
            --output "$RUNNER_TEMP/sbom" --filename "trislab-framework-$VERSION.nuget.cdx.json" \
            --set-name trislab-framework --set-version "$VERSION" --set-type Framework

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/nupkg/*.nupkg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-nuget
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget push "$RUNNER_TEMP/nupkg/*.nupkg" \
            --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" \
            --api-key "$GH_TOKEN" \
            --skip-duplicate
          echo "Published $(ls "$RUNNER_TEMP"/nupkg/*.nupkg | wc -l) NuGet packages at ${GITHUB_REF_NAME#v}" >> "$GITHUB_STEP_SUMMARY"

  npm:
    name: npm
    runs-on: ubuntu-24.04
    needs: nuget
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the packages
        id: find
        run: |
          dirs=$(find packages -mindepth 2 -maxdepth 2 -name package.json -printf '%h\n' 2>/dev/null | sort || true)
          echo "dirs=$(echo $dirs)" >> "$GITHUB_OUTPUT"
          [ -n "$dirs" ] || echo "No npm package in packages/ yet" >> "$GITHUB_STEP_SUMMARY"

      - if: steps.find.outputs.dirs != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@trislabcompany'

      - name: Build, pack and publish
        if: steps.find.outputs.dirs != ''
        env:
          DIRS: ${{ steps.find.outputs.dirs }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # npm refuses a prerelease without a dist-tag; -rc.<n> goes to "next", never "latest".
          dist_tag=latest
          [[ $version == *-* ]] && dist_tag=next
          mkdir -p "$RUNNER_TEMP/tgz" "$RUNNER_TEMP/sbom"
          for dir in $DIRS; do
            (
              cd "$dir"
              name=$(node -p "require('./package.json').name")
              npm ci
              npm version "$version" --no-git-tag-version --allow-same-version
              npm run build --if-present
              # The SBOM lists what a product installs with the package: its dependencies, not its dev dependencies.
              npm sbom --sbom-format cyclonedx --omit dev > "$RUNNER_TEMP/sbom/${name#@trislabcompany/}-$version.npm.cdx.json"
              # The file that is attested is the file that is published.
              # npm names it <scope>-<name>-<version>.tgz.
              npm pack --pack-destination "$RUNNER_TEMP/tgz" > /dev/null
              tgz="$RUNNER_TEMP/tgz/$(echo "${name#@}" | tr / -)-$version.tgz"
              test -f "$tgz"
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "$name@$version is already published" >> "$GITHUB_STEP_SUMMARY"
              else
                npm publish "$tgz" --tag "$dist_tag"
                echo "Published $name@$version ($dist_tag)" >> "$GITHUB_STEP_SUMMARY"
              fi
            )
          done

      - if: steps.find.outputs.dirs != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/tgz/*.tgz

      - if: steps.find.outputs.dirs != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-npm
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error

  # The SBOMs go on the GitHub Release of the tag, which an organization owner
  # creates with the tag (`gh release create`). Without a release yet, they
  # stay in the run's artifacts, and a re-run of this job attaches them.
  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    needs: [nuget, npm]
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: sbom
          merge-multiple: true

      - name: Attach the SBOMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" sbom/*.cdx.json --repo "$GITHUB_REPOSITORY" --clobber
            echo "Attached $(ls sbom/*.cdx.json | wc -l) SBOMs to the release $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::There is no GitHub Release $GITHUB_REF_NAME yet. The SBOMs are in this run's artifacts; re-run the job sbom once the release exists"
          fi
