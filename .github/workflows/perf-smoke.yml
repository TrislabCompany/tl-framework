name: perf-smoke

# Runs the test host as a container with its seed data and a k6 smoke test of the main endpoints on every
# PR. Every endpoint has a p95 time budget in tests/perf/smoke.js; a missed budget, or more than 1 percent
# of failed requests, fails the job. Kept out of ci.yml, which only calls the platform's reusable workflow.
# See tests/perf/README.md. The job is `smoke`, so the check is `perf-smoke / smoke`.

on:
  pull_request:

permissions: {}

concurrency:
  group: perf-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # grafana/k6 1.4.2, pinned by digest like every image here.
  K6_IMAGE: grafana/k6:1.4.2@sha256:3656673de3f30424e8ebcfa46acd9558d83b6a43612d0f668ffeac953950c6c7

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the test host
        shell: pwsh
        run: ./scripts/test-host.ps1 up

      - name: k6 smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/k6"
          chmod 777 "$RUNNER_TEMP/k6"
          docker run --rm --network host             -v "$PWD/tests/perf:/perf:ro" -v "$RUNNER_TEMP/k6:/out"             "$K6_IMAGE" run --summary-export /out/summary.json /perf/smoke.js

      - name: Test host log
        if: failure()
        shell: pwsh
        run: ./scripts/test-host.ps1 logs

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-smoke-summary
          path: ${{ runner.temp }}/k6/summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the test host
        if: always()
        shell: pwsh
        run: ./scripts/test-host.ps1 down
