# The services of the test host when it runs on its own (README.md): Postgres and S3-compatible
# storage, pinned like the images the integration tests start with Testcontainers.
# With `--profile container` it also builds and runs the host itself as an image (Dockerfile) on
# http://localhost:5040, the way the performance and security runs in CI use it.
name: tl-test-host

services:
  postgres:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testhost_pwd
      POSTGRES_DB: testhost
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testhost"]
      interval: 2s
      timeout: 5s
      retries: 30

  storage:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "127.0.0.1:9100:9000"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The host as a container. Off by default: `docker compose up` starts only the two services above
  # and `dotnet run` serves the host. The development settings carry the signing key and the seed
  # password; the two addresses are the compose services instead of localhost.
  host:
    profiles: ["container"]
    build:
      context: ../../..
      dockerfile: src/Tests/TestHost/Dockerfile
    image: tl-test-host:local
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TestHost__Provision: "true"
      # Members for the list endpoints to page through (tests/perf).
      TestHost__SeedUsers: "40"
      DatabaseOptions__ConnectionString: "Host=postgres;Port=5432;Database=testhost;Username=postgres;Password=testhost_pwd"
      Storage__S3__ServiceUrl: "http://storage:9000"
    ports:
      - "127.0.0.1:${TEST_HOST_PORT:-5040}:8080"
